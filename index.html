<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firmen-Research-Board</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --col: #e9ebef; --text: #1c2230; --muted: #667085;
    --line: #d5d9e0; --accent: #2f6fed; --accent-text: #ffffff; --star: #e0a100; --danger: #c93434;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171d; --panel: #222733; --col: #1a1e27; --text: #e8ebf1; --muted: #98a2b3;
      --line: #343b4a; --accent: #5b8dff; --accent-text: #0d1017; --star: #f2c14e; --danger: #ff7b7b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 16px; }
  h1 { font-size: 20px; margin: 0; margin-right: auto; }
  input, textarea, select, button { font: inherit; color: inherit; }
  input[type=text], input[type=search], textarea, select {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%;
  }
  header input[type=search] { width: 220px; }
  button { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 8px 14px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  button.danger { color: var(--danger); margin-right: auto; }
  main { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; padding: 0 16px 24px; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } header input[type=search] { width: 100%; } }
  .column { background: var(--col); border-radius: 12px; padding: 12px; min-height: 240px; border: 2px dashed transparent; }
  .column.over { border-color: var(--accent); }
  .column h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  .column h2 span:first-child { margin-right: auto; }
  .sort { padding: 2px 8px; font-size: 12px; font-weight: 400; letter-spacing: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; cursor: grab;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .card:hover { border-color: var(--accent); }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card.dragging { opacity: .4; }
  .card.ghost { position: fixed; left: 0; top: 0; z-index: 10; margin: 0; pointer-events: none; opacity: .92;
    border-color: var(--accent); box-shadow: 0 10px 28px rgba(0, 0, 0, .3); }
  .card.drop-before { box-shadow: 0 -4px 0 var(--accent); }
  .card.drop-after { box-shadow: 0 4px 0 var(--accent); }
  .card .name { font-weight: 600; overflow-wrap: anywhere; }
  .card .sector { color: var(--muted); font-size: 13px; }
  .card .stars { color: var(--star); letter-spacing: 2px; }
  .card .notes { margin-top: 6px; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 24px 0; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 20; display: flex; align-items: center; gap: 12px;
    max-width: calc(100vw - 32px); padding: 10px 10px 10px 16px; background: var(--text); color: var(--bg); border-radius: 10px; box-shadow: 0 8px 24px rgba(0, 0, 0, .3); }
  .toast[hidden] { display: none; }
  .toast span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toast button { flex: none; background: transparent; border-color: currentColor; padding: 6px 12px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 14px; padding: 20px; width: min(460px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(0, 0, 0, .45); }
  dialog h3 { margin: 0 0 12px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  label > * { margin-top: 4px; }
  textarea { min-height: 110px; resize: vertical; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .rating { display: flex; align-items: center; gap: 10px; }
  .rating input { flex: 1; }
  .rating output { color: var(--star); letter-spacing: 2px; min-width: 90px; }
  .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
</style>
</head>
<body>

<header>
  <h1>Firmen-Research-Board</h1>
  <input type="search" id="search" placeholder="Suchen …" aria-label="Suchen">
  <button id="import">Import (JSON)</button>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <button id="export">Export (JSON)</button>
  <button id="add" class="primary">+ Unternehmen</button>
</header>

<main>
  <section class="column" data-status="offen"><h2><span>Offen</span><button class="sort" title="Nach Bewertung sortieren" aria-label="Offen nach Bewertung sortieren">★ ↓</button><span class="count"></span></h2><div class="cards"></div></section>
  <section class="column" data-status="arbeit"><h2><span>In Arbeit</span><button class="sort" title="Nach Bewertung sortieren" aria-label="In Arbeit nach Bewertung sortieren">★ ↓</button><span class="count"></span></h2><div class="cards"></div></section>
  <section class="column" data-status="fertig"><h2><span>Fertig</span><button class="sort" title="Nach Bewertung sortieren" aria-label="Fertig nach Bewertung sortieren">★ ↓</button><span class="count"></span></h2><div class="cards"></div></section>
</main>

<div id="live" class="sr-only" role="status"></div>

<div id="toast" class="toast" role="status" hidden>
  <span id="toastText"></span>
  <button id="undo">Rückgängig</button>
</div>

<dialog id="dialog">
  <form method="dialog" id="form">
    <h3 id="dialogTitle">Unternehmen</h3>
    <label>Name<input type="text" id="fName" required></label>
    <div class="row">
      <label>Branche<input type="text" id="fSector"></label>
      <label>Status
        <select id="fStatus">
          <option value="offen">Offen</option>
          <option value="arbeit">In Arbeit</option>
          <option value="fertig">Fertig</option>
        </select>
      </label>
    </div>
    <label>Bewertung
      <span class="rating"><input type="range" id="fRating" min="0" max="5" step="1"><output id="fStars"></output></span>
    </label>
    <label>Notizen<textarea id="fNotes" placeholder="Geschäftsmodell, Kennzahlen, offene Fragen …"></textarea></label>
    <div class="actions">
      <button type="button" id="delete" class="danger">Löschen</button>
      <button type="button" id="cancel">Abbrechen</button>
      <button type="submit" class="primary">Speichern</button>
    </div>
  </form>
</dialog>

<script>
const STORAGE_KEY = 'research-board-v1';
const LONG_PRESS_MS = 400;
const SCROLL_EDGE = 60;
const UNDO_MS = 10000;
const $ = id => document.getElementById(id);
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const stars = n =>'★'.repeat(n) + '☆'.repeat(5 - n);
const STATUSES = [...document.querySelectorAll('.column')].map(column => column.dataset.status);

let companies = load();
let editingId = null;
let touchDrag = null;
let undo = null;

function load() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { return []; }
}
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(companies)); } catch {}
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text) node.textContent = text;
  return node;
}

function render() {
  const query = $('search').value.trim().toLowerCase();
  document.querySelectorAll('.column').forEach(column => {
    const list = column.querySelector('.cards');
    const items = companies.filter(c => c.status === column.dataset.status &&
      (c.name + ' ' + c.sector + ' ' + c.notes).toLowerCase().includes(query));
    list.replaceChildren();
    column.querySelector('.count').textContent = items.length;
    if (!items.length) list.append(el('div', 'empty', query ? 'Keine Treffer' : 'Karte hierher ziehen'));
    items.forEach(c => {
      const card = el('div', 'card');
      card.draggable = true;
      card.dataset.id = c.id;
      card.tabIndex = 0;
      card.setAttribute('role', 'button');
      card.append(el('div', 'name', c.name));
      if (c.sector) card.append(el('div', 'sector', c.sector));
      if (c.rating) card.append(el('div', 'stars', stars(c.rating)));
      if (c.notes) card.append(el('div', 'notes', c.notes));
      card.addEventListener('click', () => openDialog(c));
      card.addEventListener('keydown', e => {
        const step = { ArrowLeft: -1, ArrowRight: 1 }[e.key];
        if (step) {
          const status = STATUSES[STATUSES.indexOf(c.status) + step];
          if (!status) return;
          e.preventDefault();
          move(c, status);
          cardFor(c.id).focus();
          return;
        }
        const sibling = { ArrowUp: 'previousElementSibling', ArrowDown: 'nextElementSibling' }[e.key];
        if (sibling) {
          const other = card[sibling];
          if (!other) return;
          e.preventDefault();
          swap(c, companies.find(company => company.id === other.dataset.id));
          cardFor(c.id).focus();
          return;
        }
        if (e.key !== 'Enter' && e.key !== ' ') return;
        e.preventDefault();
        openDialog(c);
      });
      card.addEventListener('dragstart', e => {
        endTouchDrag();
        e.dataTransfer.setData('text/plain', c.id);
        card.classList.add('dragging');
      });
      card.addEventListener('dragend', () => { card.classList.remove('dragging'); clearDropMarks(); });
      list.append(card);
    });
  });
}

const columnTitle = status => document.querySelector(`.column[data-status="${status}"] h2 span`).textContent;

function move(company, status) {
  company.status = status;
  save();
  render();
  $('live').textContent = `${company.name} nach „${columnTitle(status)}“ verschoben`;
}

function reorder(company, order) {
  companies = order;
  save();
  render();
  const cards = [...cardFor(company.id).parentNode.children];
  $('live').textContent = `${company.name} an Position ${cards.indexOf(cardFor(company.id)) + 1} von ${cards.length}`;
}

function swap(company, other) {
  const order = [...companies];
  const i = order.indexOf(company), j = order.indexOf(other);
  [order[i], order[j]] = [order[j], order[i]];
  reorder(company, order);
}

function place(company, status, before) {
  const inColumn = list => list.filter(c => c.status === status);
  const order = companies.filter(c => c !== company);
  order.splice(before ? order.indexOf(before) : order.length, 0, company);
  if (company.status !== status) {
    companies = order;
    move(company, status);
  } else if (inColumn(order).some((c, i) => c !== inColumn(companies)[i])) reorder(company, order);
}

function cardBelow(column, y) {
  return [...column.querySelectorAll('.card:not(.dragging)')].find(card => {
    const box = card.getBoundingClientRect();
    return y < box.top + box.height / 2;
  });
}

function clearDropMarks() {
  document.querySelectorAll('.over, .drop-before, .drop-after').forEach(node => node.classList.remove('over', 'drop-before', 'drop-after'));
}

function openDialog(company) {
  editingId = company ? company.id : null;
  $('dialogTitle').textContent = company ? 'Unternehmen bearbeiten' : 'Neues Unternehmen';
  $('fName').value = company ? company.name : '';
  $('fSector').value = company ? company.sector : '';
  $('fStatus').value = company ? company.status : 'offen';
  $('fRating').value = company ? company.rating : 0;
  $('fNotes').value = company ? company.notes : '';
  $('fStars').textContent = stars(+$('fRating').value);
  $('delete').hidden = !company;
  $('dialog').showModal();
}

$('form').addEventListener('submit', () => {
  const data = {
    name: $('fName').value.trim(),
    sector: $('fSector').value.trim(),
    status: $('fStatus').value,
    rating: +$('fRating').value,
    notes: $('fNotes').value.trim(),
  };
  let company = companies.find(c => c.id === editingId);
  if (company) Object.assign(company, data);
  else companies.push(company = { id: newId(), ...data });
  editingId = company.id;
  save();
  render();
});

const cardFor = id => [...document.querySelectorAll('.card')].find(node => node.dataset.id === id);

$('dialog').addEventListener('close', () => (cardFor(editingId) || $('add')).focus());

$('delete').addEventListener('click', () => {
  if (!confirm('Dieses Unternehmen wirklich löschen?')) return;
  const card = cardFor(editingId);
  const neighbor = card && (card.nextElementSibling || card.previousElementSibling);
  const index = companies.findIndex(c => c.id === editingId);
  const [company] = companies.splice(index, 1);
  editingId = neighbor ? neighbor.dataset.id : null;
  save();
  render();
  $('dialog').close();
  offerUndo(`„${company.name}“ gelöscht`, () => {
    if (companies.some(c => c.id === company.id)) return;
    companies.splice(Math.min(index, companies.length), 0, company);
    save();
    render();
    $('live').textContent = `${company.name} wiederhergestellt`;
    (cardFor(company.id) || $('add')).focus();
  });
});

function setColumnOrder(status, order) {
  let i = 0;
  companies = companies.map(c => c.status === status ? order[i++] : c);
  save();
  render();
}

function sortByRating(status) {
  const title = columnTitle(status);
  const previous = companies.filter(c => c.status === status);
  const sorted = [...previous].sort((a, b) => b.rating - a.rating);
  if (sorted.every((c, i) => c === previous[i])) {
    $('live').textContent = `„${title}“ ist bereits nach Bewertung sortiert`;
    return;
  }
  setColumnOrder(status, sorted);
  $('live').textContent = `„${title}“ nach Bewertung sortiert`;
  offerUndo(`„${title}“ sortiert`, () => {
    const current = companies.filter(c => c.status === status);
    setColumnOrder(status, current.sort((a, b) => previous.indexOf(a) - previous.indexOf(b)));
    $('live').textContent = `Vorherige Reihenfolge in „${title}“ wiederhergestellt`;
  });
}

document.querySelectorAll('.sort').forEach(button => {
  button.addEventListener('click', () => sortByRating(button.closest('.column').dataset.status));
});

function offerUndo(text, revert) {
  hideUndo();
  undo = { revert, timer: setTimeout(hideUndo, UNDO_MS) };
  $('toastText').textContent = text;
  $('toast').hidden = false;
}

function hideUndo() {
  if (undo) clearTimeout(undo.timer);
  undo = null;
  $('toast').hidden = true;
}

function restore() {
  if (!undo) return;
  const { revert } = undo;
  hideUndo();
  revert();
}

$('undo').addEventListener('click', restore);
document.addEventListener('keydown', e => {
  if (!undo || !(e.ctrlKey || e.metaKey) || e.key.toLowerCase() !== 'z') return;
  if ($('dialog').open || e.target.matches('input, textarea')) return;
  e.preventDefault();
  restore();
});

$('cancel').addEventListener('click', () => $('dialog').close());
$('add').addEventListener('click', () => openDialog(null));
$('search').addEventListener('input', render);
$('fRating').addEventListener('input', () => $('fStars').textContent = stars(+$('fRating').value));

$('export').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(companies, null, 2)], { type: 'application/json' });
  const link = el('a');
  link.href = URL.createObjectURL(blob);
  link.download = `research-board-${new Date().toLocaleDateString('sv-SE')}.json`;
  link.click();
  URL.revokeObjectURL(link.href);
});

function normalize(entry) {
  if (!entry || typeof entry.name !== 'string' || !entry.name.trim()) return null;
  return {
    id: typeof entry.id === 'string' && entry.id ? entry.id : newId(),
    name: entry.name.trim(),
    sector: typeof entry.sector === 'string' ? entry.sector.trim() : '',
    status: STATUSES.includes(entry.status) ? entry.status : 'offen',
    rating: Math.min(5, Math.max(0, Math.round(+entry.rating) || 0)),
    notes: typeof entry.notes === 'string' ? entry.notes.trim() : '',
  };
}

function importCompanies(entries) {
  const incoming = new Map(entries.map(normalize).filter(Boolean).map(c => [c.id, c]));
  if (!incoming.size) return alert('Die Datei enthält keine gültigen Unternehmen.');
  const known = new Set(companies.map(c => c.id));
  const updated = [...incoming.keys()].filter(id => known.has(id)).length;
  const added = incoming.size - updated;
  const skipped = entries.length - incoming.size;
  if (!confirm(`Import: ${added} neu, ${updated} bestehende werden überschrieben` +
    (skipped ? `, ${skipped} ungültige oder doppelte übersprungen` : '') + '. Fortfahren?')) return;
  companies = companies.map(c => incoming.get(c.id) || c).concat([...incoming.values()].filter(c => !known.has(c.id)));
  save();
  render();
  $('live').textContent = `${added} Unternehmen importiert, ${updated} aktualisiert`;
}

$('import').addEventListener('click', () => $('importFile').click());
$('importFile').addEventListener('change', async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  let entries;
  try { entries = JSON.parse(await file.text()); } catch {}
  if (Array.isArray(entries)) importCompanies(entries);
  else alert('Diese Datei ist kein Export des Research-Boards.');
});

function markDrop(column, y) {
  clearDropMarks();
  column.classList.add('over');
  const before = cardBelow(column, y);
  const last = [...column.querySelectorAll('.card:not(.dragging)')].pop();
  if (before) before.classList.add('drop-before');
  else if (last) last.classList.add('drop-after');
}

function dropAt(id, column, y) {
  clearDropMarks();
  const company = companies.find(c => c.id === id);
  const before = cardBelow(column, y);
  if (company) place(company, column.dataset.status, before && companies.find(c => c.id === before.dataset.id));
}

document.querySelectorAll('.column').forEach(column => {
  column.addEventListener('dragover', e => { e.preventDefault(); markDrop(column, e.clientY); });
  column.addEventListener('dragleave', e => { if (!column.contains(e.relatedTarget)) clearDropMarks(); });
  column.addEventListener('drop', e => { e.preventDefault(); dropAt(e.dataTransfer.getData('text/plain'), column, e.clientY); });
});

const board = document.querySelector('main');
const columnAt = ({ x, y }) => document.elementFromPoint(x, y)?.closest('.column');

function endTouchDrag() {
  if (!touchDrag) return;
  clearTimeout(touchDrag.timer);
  touchDrag.card.classList.remove('dragging');
  if (touchDrag.ghost) touchDrag.ghost.remove();
  clearDropMarks();
  touchDrag = null;
}

board.addEventListener('touchstart', e => {
  endTouchDrag();
  const card = e.target.closest('.card');
  if (!card || e.touches.length !== 1) return;
  const { clientX: x, clientY: y } = e.touches[0];
  const drag = touchDrag = { card, x, y, active: false, timer: setTimeout(() => {
    drag.active = true;
    showGhost(drag);
    card.classList.add('dragging');
    requestAnimationFrame(() => autoScroll(drag));
  }, LONG_PRESS_MS) };
}, { passive: true });

function showGhost(drag) {
  const box = drag.card.getBoundingClientRect();
  drag.ghost = drag.card.cloneNode(true);
  drag.ghost.className = 'card ghost';
  drag.ghost.removeAttribute('data-id');
  drag.ghost.removeAttribute('tabindex');
  drag.ghost.setAttribute('aria-hidden', 'true');
  drag.ghost.style.width = box.width + 'px';
  drag.grabX = drag.x - box.left;
  drag.grabY = drag.y - box.top;
  moveGhost(drag);
  document.body.append(drag.ghost);
}

function moveGhost(drag) {
  drag.ghost.style.transform = `translate(${drag.x - drag.grabX}px, ${drag.y - drag.grabY}px)`;
}

function markTouchDrop() {
  const column = columnAt(touchDrag);
  if (column) markDrop(column, touchDrag.y);
  else clearDropMarks();
}

function autoScroll(drag) {
  if (drag !== touchDrag) return;
  const overTop = SCROLL_EDGE - drag.y, overBottom = drag.y - (innerHeight - SCROLL_EDGE);
  const before = scrollY;
  if (overTop > 0) scrollBy(0, -Math.min(overTop, SCROLL_EDGE) / 6);
  else if (overBottom > 0) scrollBy(0, Math.min(overBottom, SCROLL_EDGE) / 6);
  if (scrollY !== before) markTouchDrop();
  requestAnimationFrame(() => autoScroll(drag));
}

board.addEventListener('touchmove', e => {
  if (!touchDrag) return;
  const { clientX: x, clientY: y } = e.touches[0];
  if (!touchDrag.active) {
    if (Math.hypot(x - touchDrag.x, y - touchDrag.y) > 10) endTouchDrag();
    return;
  }
  e.preventDefault();
  Object.assign(touchDrag, { x, y });
  moveGhost(touchDrag);
  markTouchDrop();
}, { passive: false });

board.addEventListener('touchend', e => {
  if (!touchDrag) return;
  if (touchDrag.active) {
    e.preventDefault();
    const { clientX: x, clientY: y } = e.changedTouches[0];
    const column = columnAt({ x, y });
    if (column) dropAt(touchDrag.card.dataset.id, column, y);
  }
  endTouchDrag();
});

board.addEventListener('touchcancel', endTouchDrag);

render();
</script>
</body>
</html>
